<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能力倾向测试 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; background-color: #f4f7f6; }
        .container { width: 90%; max-width: 1000px; margin: 0 auto; }
        
        nav { padding: 20px 0; border-bottom: 1px solid #f0f0f0; background: #fff; }
        .logo { font-size: 1.5em; font-weight: bold; color: #469aa7; text-decoration: none; }

        header.hero { padding: 60px 0; min-height: 70vh; display: flex; align-items: center; }
        .hero-text { flex: 1; }
        h1 { font-size: 3em; line-height: 1.2; margin-bottom: 15px; color: #222; }
        p { font-size: 1.15em; margin-bottom: 30px; color: #555; }

        /* --- 立体感按钮核心样式 --- */
        .cta-button {
            display: inline-block;
            background-color: #469aa7;
            color: #FFFFFF;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.1s ease-out;
            box-shadow: 0 5px 0 #367d88; /* 立体厚度 */
            border: none;
            cursor: pointer;
        }

        .cta-button:active {
            transform: translateY(3px) scale(0.98); /* 点击下沉 */
            box-shadow: 0 2px 0 #367d88; /* 阴影变浅 */
        }

        .how-it-works { padding: 80px 0; text-align: center; background: #fff; }
        .how-it-works li::before {
            content: counter(steps-counter);
            counter-increment: steps-counter;
            display: block; width: 50px; height: 50px; line-height: 50px;
            margin: 0 auto 20px; border-radius: 50%; background: #f0f0f0; color: #469aa7; font-weight: bold;
        }

        .final-cta { background-color: #333; color: #FFFFFF; padding: 80px 0; text-align: center; }
        .final-cta h2 { margin-bottom: 20px; color: #fff; }

        footer { padding: 40px 0; text-align: center; color: #888; font-size: 0.9em; }

        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            .hero-image { display: none; }
        }
    </style>
</head>
<body>
    <nav><div class="container"><a href="#" class="logo">神秘问卷</a></div></nav>
    <header class="hero">
        <div class="container">
            <div class="hero-text">
                <h1>快给我们做个问卷😄</h1>
                <p>只需几分钟，探索你的内在特质</p>
                <a href="test.html" class="cta-button">开始测试</a>
            </div>
        </div>
    </header>
    <section class="final-cta">
        <div class="container">
            <h2>准备好了吗？</h2>
            <p>获取你专属的深度人格报告</p>
            <a href="test.html" class="cta-button">立即开始测试</a>
        </div>
    </section>
    <footer><p>&copy; 2026 Archego 保留所有权利</p></footer>
</body>
</html>
