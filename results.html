<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; color: #333; padding: 20px; }
        .results-container { max-width: 800px; margin: 30px auto; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #6C63FF; margin-bottom: 5px; }
        .username-display { font-size: 1.2em; color: #555; margin-bottom: 30px; }
        
        /* 图表容器 */
        .chart-container { position: relative; margin: 0 auto 40px auto; height: 400px; width: 100%; }
        
        /* 分数列表样式 */
        .score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 30px; text-align: left; }
        .score-item { background: #f9f9ff; padding: 15px; border-radius: 10px; border-left: 4px solid #6C63FF; display: flex; justify-content: space-between; align-items: center; }
        .dimension-name { font-weight: bold; color: #444; }
        .dimension-score { color: #6C63FF; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        
        .btn { background: #6C63FF; color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 16px; margin-top: 30px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #5a52d5; }
    </style>
</head>
<body>

    <div class="results-container">
        <h1>测试分析结果</h1>
        <p class="username-display">体验者：<span id="display-username">加载中...</span></p>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <h3 style="text-align: left; color: #6C63FF; border-bottom: 2px solid #eee; padding-bottom: 10px;">维度得分详情</h3>
        <div id="score-summary-list" class="score-grid">
            </div>

        <a href="index.html" class="btn">重新测试</a>
    </div>

    <script type="module">
        import { getQuestions, SCALES_ORDER } from './questions.js';

        window.onload = async function() {
            const username = localStorage.getItem('quizUsername') || '匿名用户';
            const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '[]');
            const allQuestions = getQuestions();

            if (userAnswers.length === 0) {
                alert('未找到测试记录，请先完成测试。');
                window.location.href = 'test.html';
                return;
            }

            document.getElementById('display-username').innerText = username;

            // 1. 计分逻辑
            function calculateResults(answers, questions) {
                const rawScores = {};
                const counts = {};
                const jungScales = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
                const llosScales = ['Intrinsic', 'Integrated', 'Identified', 'Introjected', 'External', 'Amotivation'];

                // 初始化
                SCALES_ORDER.forEach(s => { rawScores[s] = 0; counts[s] = 0; });

                // 累加
                answers.forEach(ans => {
                    const q = questions.find(item => item.id === parseInt(ans.id));
                    if (q && q.scale && rawScores.hasOwnProperty(q.scale)) {
                        rawScores[q.scale] += parseInt(ans.value);
                        counts[q.scale]++;
                    }
                });

                const finalScores = {};
                // 语言动机 (1-5 平均分)
                llosScales.forEach(s => {
                    finalScores[s] = counts[s] > 0 ? (rawScores[s] / counts[s]).toFixed(2) : "0.00";
                });
                // 荣格功能 (20分原始分 * 1.5 = 30分制)
                jungScales.forEach(s => {
                    finalScores[s] = counts[s] > 0 ? (rawScores[s] * 1.5).toFixed(1) : "0.0";
                });

                return finalScores;
            }

            const scores = calculateResults(userAnswers, allQuestions);

            // 2. 渲染显示列表
            const scoreSummaryList = document.getElementById('score-summary-list');
            SCALES_ORDER.forEach((label) => {
                const isJung = ['Ne','Ni','Se','Si','Fe','Fi','Te','Ti'].includes(label);
                const maxVal = isJung ? "30.0" : "5.0";
                
                const item = document.createElement('div');
                item.className = 'score-item';
                item.innerHTML = `
                    <span class="dimension-name">${label}</span>
                    <span class="dimension-score">${scores[label]} / ${maxVal}</span>
                `;
                scoreSummaryList.appendChild(item);
            });

            // 3. 绘制雷达图
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: SCALES_ORDER,
                    datasets: [{
                        label: '得分分布',
                        data: SCALES_ORDER.map(label => scores[label]),
                        backgroundColor: 'rgba(108, 99, 255, 0.2)',
                        borderColor: '#6C63FF',
                        pointBackgroundColor: '#6C63FF',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            suggestedMin: 0,
                            suggestedMax: 30, // 适配 30 分制
                            ticks: { stepSize: 5 }
                        }
                    }
                }
            });

            // 4. 发送到后端保存
            try {
                const response = await fetch('/.netlify/functions/save_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, scores })
                });
                if (!response.ok) console.error('数据保存失败');
            } catch (err) {
                console.error('网络错误，无法保存数据:', err);
            }
        };
    </script>
</body>
</html>
