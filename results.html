<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archego | 提交成功</title>
    <link rel="icon" href="logo.jpg" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f6; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg_image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .results-container { 
            width: 90%;
            max-width: 500px; 
            padding: 30px; 
            background: rgba(255, 255, 255, 0.9); 
            border-radius: 24px; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.1); 
            text-align: center;
        }

        h1 { color: #469aa7; margin-bottom: 10px; font-size: 1.5em; }
        .thank-you { color: #666; font-size: 1em; margin-bottom: 25px; }

        .reward-image {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            -webkit-touch-callout: default; 
        }

        .hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="results-container">
        <h1>提交成功</h1>
        <p class="thank-you">感谢参与！请扫描下方二维码参与抽奖</p>
        
        <img src="reward_image.jpg" alt="reward" class="reward-image">

        <div class="hint">
            <p>长按图片保存到相册</p>
            <p>或在微信中识别二维码参与</p>
        </div>
    </div>

    <script>
        // 清理本地数据，防止重复提交
        localStorage.clear();
    </script>
</body>
</html>
