<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结果</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        .results-container { max-width: 600px; margin: 30px auto; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #6C63FF; }
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .score-item { background: #f9f9ff; padding: 15px; border-radius: 10px; border-left: 4px solid #6C63FF; display: flex; justify-content: space-between; }
        .dim-name { font-weight: bold; }
        .dim-val { color: #6C63FF; font-weight: bold; }
        .btn { background: #6C63FF; color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; display: inline-block; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="results-container">
        <h1>荣格认知功能分析</h1>
        <p>体验者：<span id="display-username"></span></p>
        
        <div id="jung-scores" class="score-grid">
            </div>

        <a href="index.html" class="btn">重新测试</a>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';

        window.onload = async function() {
            const username = localStorage.getItem('quizUsername') || '匿名用户';
            const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '[]');
            const allQuestions = getQuestions();
            document.getElementById('display-username').innerText = username;

            // 1. 计分逻辑 (虽然只显示8维，但建议14个都算出来发给后端备份)
            function calculate(answers, questions) {
                const res = {};
                const jungScales = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
                const llosScales = ['Intrinsic', 'Integrated', 'Identified', 'Introjected', 'External', 'Amotivation'];
                
                const raw = {};
                [...jungScales, ...llosScales].forEach(s => raw[s] = 0);

                answers.forEach(ans => {
                    const q = questions.find(item => item.id === parseInt(ans.id));
                    if (q && q.scale) raw[q.scale] += parseInt(ans.value);
                });

                // 统一转换
                llosScales.forEach(s => res[s] = (raw[s] / 5).toFixed(2)); // 动机5分制
                jungScales.forEach(s => res[s] = (raw[s] * 1.5).toFixed(1)); // 功能30分制
                return res;
            }

            const scores = calculate(userAnswers, allQuestions);

            // 2. 只渲染荣格八维到页面
            const jungScales = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
            const container = document.getElementById('jung-scores');
            jungScales.forEach(s => {
                const div = document.createElement('div');
                div.className = 'score-item';
                div.innerHTML = `<span class="dim-name">${s}</span><span class="dim-val">${scores[s]} / 30.0</span>`;
                container.appendChild(div);
            });

            // 3. 后端静默保存 (包含所有14个维度数据)
            fetch('/.netlify/functions/save_data', {
                method: 'POST',
                body: JSON.stringify({ username, scores })
            });
        };
    </script>
</body>
</html>
