<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archego | 问卷结果</title>
	<link rel="icon" href="logo.jpg" type="image/png">

    <style>
        /* 全局禁止选中 */
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

			background-image: url('bg_image.jpg');
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
			background-repeat: no-repeat;
        }

        .results-container { 
            width: 100%;
            max-width: 900px; 
            padding: 50px 40px; 
            background: rgba(255, 255, 255, 0.7); 
            border-radius: 24px; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.04); 
        }

        h1 { color: #469aa7; margin-bottom: 10px; font-size: 2em; text-align: center; }
        .thank-you { color: #888; font-size: 1.1em; margin-bottom: 50px; text-align: center; }

        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 左侧标签 */
        .label-box {
            width: 110px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .dim-name {
            display: block;
            font-size: 1.4em;
            font-weight: bold;
            color: #469aa7; /* 青色字样 */
        }

        .dim-desc {
            display: block;
            font-size: 0.85em;
            color: #999;
            margin-top: 2px;
        }

        .bar-track {
            flex: 1;
            height: 18px;
            background: #eee;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #b5d9dc; /* 条型填充色 */
            border-radius: 10px;
            width: 0%; 
            transition: width 1s cubic-bezier(0.1, 0.5, 0.3, 1);
            position: relative;
        }

        .bar-val {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="results-container">
        <h1>你的认知功能分布</h1>
        <p class="thank-you">感谢填写问卷</p>
        
        <div id="chart" class="chart-container">
            </div>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';

        const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '[]');
        const allQuestions = getQuestions();

        // 维度的中文释义
        const descMap = {
            'Ne': '外倾直觉', 'Ni': '内倾直觉',
            'Se': '外倾感觉', 'Si': '内倾感觉',
            'Fe': '外倾情感', 'Fi': '内倾情感',
            'Te': '外倾思考', 'Ti': '内倾思考'
        };

        function calculateJungBalanced(answers, questions) {
            // 定义计算逻辑所需的维度
            const scales = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
            const TOTAL_ENERGY = 240; 
            let raw = {};
            scales.forEach(s => raw[s] = 0);

            let sumRaw = 0;
            answers.forEach(ans => {
                const q = questions.find(item => item.id === parseInt(ans.id));
                if (q && q.part === 'Jung') {
                    const val = parseInt(ans.value);
                    raw[q.scale] += val;
                    sumRaw += val;
                }
            });

            const finalScores = {};
            const divisor = sumRaw || 1;
            scales.forEach(s => {
                let share = (raw[s] / divisor) * TOTAL_ENERGY;
                finalScores[s] = share.toFixed(1);
            });
            return finalScores;
        }

        const scores = calculateJungBalanced(userAnswers, allQuestions);
        const chart = document.getElementById('chart');

        // 按照指定的顺序显示：Ne, Ni, Se, Si, Fe, Fi, Te, Ti
        const order = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];

        order.forEach(s => {
            const item = document.createElement('div');
            item.className = 'bar-item';
            // 比例尺计算：基于 100 分作为能量条最大视觉长度参考
            const percentage = Math.min(100, (scores[s] / 100) * 100);

            item.innerHTML = `
                <div class="label-box">
                    <span class="dim-name">${s}</span>
                    <span class="dim-desc">${descMap[s]}</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0%" data-percent="${percentage}">
                        <span class="bar-val">${scores[s]}</span>
                    </div>
                </div>
            `;
            chart.appendChild(item);
        });

        // 触发滑出动画
        setTimeout(() => {
            document.querySelectorAll('.bar-fill').forEach(bar => {
                bar.style.width = bar.dataset.percent + '%';
            });
        }, 100);
    </script>
</body>
</html>
