<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>测试结果</title>
		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
		
		<style>
			/* --- 结果页基础样式 --- */
			body { 
				font-family: Arial, sans-serif; 
				text-align: center; 
				background-color: #f4f7f6; 
				color: #333;
				padding: 20px;
			}

			/* 结果容器和标题样式 */
			.results-container {
				max-width: 800px;
				margin: 50px auto;
				padding: 40px;
				background-color: #ffffff;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
			}

			h1 {
				color: #6C63FF;
				font-size: 2.2em;
				margin-bottom: 10px;
			}

			p.username-display {
				font-size: 1.2em;
				color: #555;
				margin-bottom: 40px;
			}

			/* --- 雷达图容器样式 --- */
			.chart-box {
				width: 100%;
				height: auto;
				margin: 40px auto;
			}
			
			#radarChart {
				max-width: 600px;
				margin: 0 auto;
			}

			/* --- 维度分数列表样式 --- */
			.score-summary {
				text-align: left;
				margin-top: 30px;
				padding: 0 20px;
			}

			.score-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 10px 0;
				border-bottom: 1px dashed #eee;
			}

			.score-item:last-child {
				border-bottom: none;
			}

			.dimension-name {
				font-weight: bold;
				color: #4A4A4A;
			}

			.dimension-score {
				background-color: #e6e6ff;
				color: #6C63FF;
				padding: 5px 10px;
				border-radius: 4px;
				font-weight: bold;
			}
			
			/* --- 返回按钮样式 --- */
			.restart-button {
				display: inline-block;
				background-color: #6C63FF;
				color: white;
				padding: 12px 30px;
				border: none;
				border-radius: 25px;
				font-size: 1.1em;
				cursor: pointer;
				text-decoration: none;
				margin-top: 40px;
				transition: background-color 0.3s;
			}
			
			.restart-button:hover {
				background-color: #574BDB;
			}
		</style>
	</head>
	<body>

		<div class="results-container">
			<h1>您的能力倾向测试结果</h1>
			<p class="username-display" id="user-greeting">正在加载...</p>

			<div class="chart-box">
				<canvas id="radarChart"></canvas>
			</div>

			<h2>人格可发展领域总结</h2>
			<div id="score-summary-list" class="score-summary"></div>

			<a href="test.html" class="restart-button">重新测试</a>
		</div>

		<script type="module">
			import { getQuestions, SCALES_ORDER } from './questions.js';

			window.onload = function() {
				// 从 localStorage 读取测试数据
				const username = localStorage.getItem('survey_username') || '匿名用户';
				const userAnswers = JSON.parse(localStorage.getItem('survey_answers') || '[]');
				const questions = getQuestions(); // 获取包含 part 信息的完整题目列表

				if (userAnswers.length === 0) {
					alert('未找到测试记录，请重新测试。');
					window.location.href = 'test.html';
					return;
				}

				document.getElementById('display-username').innerText = username;

					// --- 修改 results.html 中的计分逻辑 ---
					function calculateResults(answers, allQuestions) {
						const rawScores = {};
						const counts = {};
						
						// 14个维度定义
						const llosScales = ['Intrinsic', 'Integrated', 'Identified', 'Introjected', 'External', 'Amotivation'];
						const jungScales = ['Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
						const allScales = [...llosScales, ...jungScales];

						allScales.forEach(s => { rawScores[s] = 0; counts[s] = 0; });

						// 累加原始分
						answers.forEach(ans => {
							const q = allQuestions.find(item => item.id === ans.id);
							if (q && q.scale && rawScores.hasOwnProperty(q.scale)) {
								rawScores[q.scale] += parseInt(ans.value);
								counts[q.scale] += 1;
							}
						});

						const finalScores = {};

						// 语言动机：保留 1-5 平均分（展现细微动机差异）
						llosScales.forEach(s => {
							finalScores[s] = counts[s] > 0 ? (rawScores[s] / counts[s]).toFixed(2) : "0.00";
						});

						// 荣格功能：实现每项 30 分制（总分 240）
						// 逻辑：4道题原始最高20分，乘以 1.5 映射到 30 分，从而拉开高分差距，体现相对强弱
						jungScales.forEach(s => {
							if (counts[s] > 0) {
								let scaledScore = rawScores[s] * 1.5; 
								finalScores[s] = scaledScore.toFixed(1);
							} else {
								finalScores[s] = "0.0";
							}
						});

						return finalScores;
					}

					// 处理 8 个荣格功能：采用 30 分制 (映射后总分 240)
					// 逻辑：原始 4 题最高 20 分，乘以 1.5 放大到 30 分，突出高分题目的权重
					jungScales.forEach(s => {
						if (counts[s] > 0) {
							let scaledScore = rawScores[s] * 1.5; 
							finalScores[s] = scaledScore.toFixed(1);
						} else {
							finalScores[s] = "0.0";
						}
					});

					return finalScores;
				}

				const scores = calculateResults(userAnswers, questions);

				// 准备图表数据
				const labels = SCALES_ORDER;
				const dataScores = labels.map(label => scores[label]);

				// 渲染文字列表
				const scoreSummaryList = document.getElementById('score-summary-list');
				labels.forEach((label, index) => {
					const item = document.createElement('div');
					item.className = 'score-item';
					item.innerHTML = `
						<span class="dimension-name">${label}</span>
						<span class="dimension-score">${dataScores[index]} / 10.0</span>
					`;
					scoreSummaryList.appendChild(item);
				});

				// 绘制雷达图
				const ctx = document.getElementById('radarChart').getContext('2d');
				new Chart(ctx, {
					type: 'radar',
					data: {
						labels: labels,
						datasets: [{
							label: '能力与动机倾向',
							data: dataScores,
							backgroundColor: 'rgba(108, 99, 255, 0.2)',
							borderColor: '#6C63FF',
							pointBackgroundColor: '#6C63FF',
							borderWidth: 2
						}]
					},
					options: {
						scales: {
							r: {
								suggestedMin: 0,
								suggestedMax: 10,
								ticks: { stepSize: 2 }
							}
						}
					}
				});

				// 异步保存到 Google Sheets (调用 save_data.js)
				fetch('/.netlify/functions/save_data', {
					method: 'POST',
					body: JSON.stringify({ username, scores })
				}).catch(err => console.error('保存失败:', err));
			};
		</script>
	</body>
</html>
