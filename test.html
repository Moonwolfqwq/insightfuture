<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能力倾向测试</title>
    <style>
        /* 全局：禁止选择，移除移动端默认高亮 */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background-color: #f4f7f6; 
            color: #333; 
            padding: 15px;
            overflow-x: hidden;
        }
        
        .quiz-container { 
            max-width: 850px; 
            margin: 20px auto; 
            padding: 40px 25px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); 
        }

        h2#question-text { 
            color: #000; 
            font-size: 1.6em; 
            margin: 20px 0 40px 0;
            line-height: 1.5;
            font-weight: 600;
        }

        /* 按钮反馈 */
        .btn { 
            background: #6C63FF; 
            color: white; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 35px; 
            cursor: pointer; 
            font-size: 18px; 
            transition: transform 0.1s, background 0.2s;
        }
        
        /* 模拟物理点按：瞬间收缩 */
        .btn:active { 
            transform: scale(0.92);
            background: #4a42b5;
        }

        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #e8e8ed; color: #555; margin-right: 15px; }

        #question-counter { text-align: left; font-size: 14px; color: #6C63FF; font-weight: bold; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; margin-bottom: 40px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #6C63FF; transition: width 0.4s ease; }
        #question-prefix { text-align: center; font-size: 14px; color: #999; font-weight: bold; min-height: 20px; margin-bottom: 10px; }

        /* 选项反馈 */
        .options-container { display: flex; justify-content: space-between; margin: 40px 0; }
        .circle-wrapper { cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .circle { 
            width: 34px; height: 34px; 
            border: 2px solid #6C63FF; 
            border-radius: 50%; 
            margin-bottom: 10px; 
            transition: transform 0.1s, background 0.2s;
            background: white; 
        }

        /* 选项点击反馈：缩放+变色 */
        .circle-wrapper:active .circle {
            transform: scale(0.85);
            background: rgba(108,99,255,0.1);
        }

        .circle.active { 
            background: #6C63FF !important; 
            box-shadow: 0 0 12px rgba(108,99,255,0.3); 
        }

        .circle-wrapper span { font-size: 12px; color: #666; font-weight: 500; }
        .button-group { display: flex; justify-content: center; align-items: center; margin-top: 20px; }
        #quiz-view { display: none; }

        @media (max-width: 480px) {
            h2#question-text { font-size: 1.3em; }
            .circle { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <div id="start-view" class="quiz-container" style="margin-top:50px;">
        <h1>欢迎参加测试</h1>
        <p>请输入您的姓名以开始</p>
        <input type="text" id="username-input" style="user-select:text; -webkit-user-select:text; width:80%; padding:15px; margin:20px 0; border:2px solid #eee; border-radius:12px; outline:none;" placeholder="您的姓名">
        <br>
        <button id="start-btn" class="btn">进入测试</button>
    </div>

    <div id="quiz-view">
        <div class="quiz-container">
            <div id="question-counter"></div>
            <div class="progress-bar"><div id="progress"></div></div>
            <div id="question-prefix"></div>
            <h2 id="question-text">加载中...</h2>

            <div class="options-container">
                <div class="circle-wrapper" data-val="1"><div class="circle"></div><span>非常不符</span></div>
                <div class="circle-wrapper" data-val="2"><div class="circle"></div><span>不符</span></div>
                <div class="circle-wrapper" data-val="3"><div class="circle"></div><span>中立</span></div>
                <div class="circle-wrapper" data-val="4"><div class="circle"></div><span>符合</span></div>
                <div class="circle-wrapper" data-val="5"><div class="circle"></div><span>非常符合</span></div>
            </div>

            <div class="button-group">
                <button id="back-btn" class="btn btn-secondary" style="display: none;">上一题</button>
                <button id="next-btn" class="btn" disabled>下一题</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';

        let questions = [];
        let currentIdx = 0;
        let userAnswers = [];

        // 触感反馈函数
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10); // 10毫秒极短震动，模拟按键感
            }
        }

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');
        const circles = document.querySelectorAll('.circle-wrapper');

        startBtn.addEventListener('click', () => {
            triggerHaptic();
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert("请输入姓名");
            localStorage.setItem('quizUsername', name);
            document.getElementById('start-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            questions = getQuestions();
            renderQuestion();
        });

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-counter').innerText = `${currentIdx + 1} / ${questions.length}`;
            
            const prefix = document.getElementById('question-prefix');
            if (q.part === 'LLOS') {
                prefix.style.visibility = "visible";
                prefix.innerText = (q.scale === 'Amotivation') ? "关于学习英语，我认为：" : "我学习英语的原因是：";
            } else {
                prefix.style.visibility = "hidden";
            }

            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + '%';
            
            backBtn.style.display = currentIdx > 0 ? "inline-block" : "none";
            nextBtn.innerText = currentIdx === questions.length - 1 ? "完成提交" : "下一题";
            
            resetOptions();
            if (userAnswers[currentIdx]) selectOption(userAnswers[currentIdx].value);
        }

        function resetOptions() {
            circles.forEach(c => c.querySelector('.circle').classList.remove('active'));
            nextBtn.disabled = true;
        }

        function selectOption(val) {
            triggerHaptic();
            circles.forEach(c => {
                const circle = c.querySelector('.circle');
                circle.classList.remove('active');
                if (c.dataset.val == val) circle.classList.add('active');
            });
            nextBtn.disabled = false;
            nextBtn.dataset.value = val;
        }

        // 使用 click 配合 CSS active 伪类实现反馈
        circles.forEach(cw => cw.addEventListener('click', () => selectOption(cw.dataset.val)));

        function handleNext() {
            triggerHaptic();
            if (nextBtn.disabled) return;
            userAnswers[currentIdx] = { id: questions[currentIdx].id, value: nextBtn.dataset.value };
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
                window.location.href = 'results.html';
            }
        }

        function handleBack() {
            triggerHaptic();
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        nextBtn.addEventListener('click', handleNext);
        backBtn.addEventListener('click', handleBack);

        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') selectOption(e.key);
            if (e.key === 'Enter') handleNext();
            if (e.key === 'Shift') handleBack();
        });
    </script>
</body>
</html>
