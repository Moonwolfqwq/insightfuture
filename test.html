<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archego | 问卷详情</title>
    <link rel="icon" href="logo.jpg" type="image/png">

    <style>
        /* 全局：禁止选择，移除移动端默认高亮 */
        * { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, sans-serif; 
            color: #333; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;

            background-image: url('bg_image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .quiz-container { 
            width: 90%;
            max-width: 850px; 
            padding: 50px 30px; 
            background: rgba(255, 255, 255, 0.7); 
            border-radius: 20px; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.04); 
            text-align: center;
        }

        #question-counter { text-align: left; font-size: 14px; color: #469aa7; font-weight: bold; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; margin-bottom: 40px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #469aa7; transition: width 0.4s ease; }
        #question-prefix { font-size: 14px; color: #999; font-weight: bold; min-height: 20px; margin-bottom: 10px; }
        h2#question-text { color: #000; font-size: 1.6em; margin: 20px 0 40px 0; line-height: 1.5; font-weight: 600; }

        /* 选项样式 */
        .options-container { display: flex; justify-content: space-between; margin: 40px 0; }
        .circle-wrapper { cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .circle { 
            width: 38px; height: 38px; border: 2px solid #469aa7; border-radius: 50%; 
            margin-bottom: 10px; transition: all 0.2s ease; background: white; 
        }
        
        .circle-wrapper:hover .circle { background: rgba(70, 154, 167, 0.05); transform: scale(1.05); }
        .circle-pressing { transform: scale(0.8); background: rgba(70, 154, 167, 0.15) !important; }
        .circle.active { background: #469aa7 !important; transform: scale(1.05); }

        .btn { 
            background: #469aa7; color: white; border: none; padding: 14px 45px; 
            border-radius: 35px; cursor: pointer; font-size: 18px; font-weight: bold;
            transition: all 0.2s ease; 
        }
        
        .btn:hover:not(:disabled) {
            background-color: #3d8691;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(70, 154, 167, 0.2);
        }

        .btn-pressing { 
            transform: translateY(2px) scale(0.97) !important; 
            background: #367d88 !important; 
            box-shadow: none !important;
            opacity: 0.9;
        }
        
        .btn:disabled { background: #ccc; transform: none !important; cursor: not-allowed; box-shadow: none !important; }
        .btn-secondary { background: #e8e8ed; color: #555; margin-right: 15px; }
        .btn-secondary:hover:not(:disabled) { background: #dfdfe4; color: #333; }

        #quiz-view { display: none; width: 100%; }
        #start-view { width: 100%; }

        input#username-input {
            user-select: text; -webkit-user-select: text; 
            width: 80%; padding: 15px; margin-bottom: 10px; 
            border: 2px solid #eee; border-radius: 12px; 
            font-size: 16px; outline: none; transition: border-color 0.2s;
            text-align: center;
        }
        input#username-input:focus { border-color: #469aa7; }
    </style>
</head>
<body>
    <div id="start-view" class="quiz-container">
        <h1 style="color:#469aa7; margin-bottom:20px;">研究说明与知情同意</h1>
        <div style="text-align: left; font-size: 15px; line-height: 1.8; color: #444; margin-bottom: 30px; padding: 0 10px;">
            <p>感谢你愿意参与本次研究。</p>
            <p>本问卷旨在了解你的语言学习动机与个体认知特点（特指荣格认知功能的相对熟悉程度），仅用于学术研究分析。</p>
            <p>问卷大约需要 <strong>5-10分钟</strong> 完成。</p>
            <p>你的参与是完全自愿的。你可以在任何时间退出问卷，且不会产生任何不良后果。</p>
            <p>本问卷不收集可识别个人身份的信息，所有数据将以匿名形式保存，仅用于研究目的。</p>
            <p>问卷中不存在正确或错误的答案，请根据你的真实感受作答。</p>
            <p style="margin-top: 15px; font-weight: bold; color: #222;">点击“进入测试”即表示你已阅读以上说明，并同意参与本研究。</p>
        </div>
        <button id="start-btn" class="btn">进入测试</button>
    </div>

    <div id="quiz-view">
        <div class="quiz-container" style="margin: 0 auto;">
            <div id="main-quiz-content">
                <div id="question-counter"></div>
                <div class="progress-bar"><div id="progress"></div></div>
                <div id="question-prefix"></div>
                <h2 id="question-text">加载中...</h2>
                
                <div class="options-container">
                    <div class="circle-wrapper" data-val="1"><div class="circle"></div><span>非常不符合</span></div>
                    <div class="circle-wrapper" data-val="2"><div class="circle"></div><span>不符合</span></div>
                    <div class="circle-wrapper" data-val="3"><div class="circle"></div><span>一般</span></div>
                    <div class="circle-wrapper" data-val="4"><div class="circle"></div><span>符合</span></div>
                    <div class="circle-wrapper" data-val="5"><div class="circle"></div><span>非常符合</span></div>
                </div>
            </div>

            <div id="name-view" style="display: none; padding: 40px 0;">
                <h2 style="font-size: 2em; margin-bottom: 40px; color: #333;">你的名字或昵称？（可选）</h2>
                <input type="text" id="username-input" placeholder="输入你的名字或昵称" spellcheck="false" 
                    style="width: 100%; max-width: 500px; padding: 18px; border: 1px solid #ddd; border-radius: 10px; font-size: 18px; text-align: left; margin-bottom: 40px;">
            </div>

            <div class="button-group">
                <button id="back-btn" class="btn btn-secondary" style="display: none;">上一题</button>
                <button id="next-btn" class="btn" disabled>下一题</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';
        const nameView = document.getElementById('name-view');
        let questions = [], currentIdx = 0, userAnswers = [];
        let isSubmitting = false;

        function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(12); }

        function attachFeedback(el, activeClass) {
            const press = () => { if(!el.disabled) el.classList.add(activeClass); };
            const release = () => el.classList.remove(activeClass);
            el.addEventListener('touchstart', press);
            el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');

        attachFeedback(startBtn, 'btn-pressing');
        attachFeedback(nextBtn, 'btn-pressing');
        attachFeedback(backBtn, 'btn-pressing');
        
        document.querySelectorAll('.circle-wrapper').forEach(cw => {
            attachFeedback(cw.querySelector('.circle'), 'circle-pressing');
            cw.addEventListener('click', () => selectOption(cw.dataset.val));
        });

        startBtn.addEventListener('click', () => {
            triggerHaptic();
            localStorage.removeItem('quiz_answers'); 
            userAnswers = []; // 显式清空数组
            currentIdx = 0;   // 进度重置

            document.getElementById('start-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            questions = getQuestions();
            renderQuestion();
        });

        function renderQuestion() {
            const q = questions[currentIdx];
            const mainContent = document.getElementById('main-quiz-content');
            const nameView = document.getElementById('name-view');

            if (currentIdx >= questions.length) {
                mainContent.style.display = "none";
                nameView.style.display = "block";
                backBtn.style.display = "inline-block";
                nextBtn.innerText = "计算结果";
                nextBtn.disabled = false;
                return;
            }

            mainContent.style.display = "block";
            nameView.style.display = "none";
            
            document.getElementById('question-counter').innerText = `${currentIdx + 1} / ${questions.length}`;
            const prefix = document.getElementById('question-prefix');
            if (q.part === 'LLOS') {
                prefix.style.visibility = "visible";
                prefix.innerText = (q.scale === 'Amotivation') ? "关于学习英语，我认为：" : "我学习英语的原因是：";
            } else { prefix.style.visibility = "hidden"; }
            
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + '%';
            
            backBtn.style.display = currentIdx > 0 ? "inline-block" : "none";
            nextBtn.innerText = "下一题";

            resetOptions();
            if (userAnswers[currentIdx]) selectOption(userAnswers[currentIdx].value);
        }

        function resetOptions() {
            document.querySelectorAll('.circle').forEach(c => c.classList.remove('active'));
            nextBtn.disabled = true;
        }

        function selectOption(val) {
            triggerHaptic();
            document.querySelectorAll('.circle-wrapper').forEach(cw => {
                cw.querySelector('.circle').classList.toggle('active', cw.dataset.val == val);
            });
            nextBtn.disabled = false;
            nextBtn.dataset.value = val;
        }

        async function uploadResults() {
            if (isSubmitting) return; 
            isSubmitting = true;
            nextBtn.disabled = true;

            const username = document.getElementById('username-input').value.trim() || "被试";
            const scales = ['Intrinsic', 'Integrated', 'Identified', 'Introjected', 'External', 'Amotivation', 'Ne', 'Ni', 'Se', 'Si', 'Fe', 'Fi', 'Te', 'Ti'];
            let scores = {};
            scales.forEach(s => scores[s] = 0);

            // 累加总分
            userAnswers.forEach(ans => {
                const q = questions.find(item => item.id === parseInt(ans.id));
                if (q && scores.hasOwnProperty(q.scale)) scores[q.scale] += parseInt(ans.value);
            });

            // 计算 Normative 平均分 (1-5分)
            const divMap = {
                'Intrinsic': 7, 'Integrated': 5, 'Identified': 5, 'Introjected': 5, 'External': 5, 'Amotivation': 5,
                'Ne': 4, 'Ni': 4, 'Se': 4, 'Si': 4, 'Fe': 4, 'Fi': 4, 'Te': 4, 'Ti': 4
            };

            Object.keys(scores).forEach(key => {
                const average = scores[key] / (divMap[key] || 1);
                scores[key] = parseFloat(average.toFixed(1)); 
            });

            // 将计算好的原始平均分存入 localStorage 供结果页使用
            localStorage.setItem('normative_scores', JSON.stringify(scores));

            try {
                const response = await fetch('/.netlify/functions/save_data', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, scores }) 
                });
                if (response.ok) {
                    localStorage.removeItem('quiz_answers'); 
                    window.location.href = 'results.html';
                } else { throw new Error("提交失败"); }
            } catch (err) {
                isSubmitting = false;
                nextBtn.disabled = false;
            }
        }

        function handleNext() {
            if (currentIdx < questions.length) {
                if (nextBtn.disabled) return;
                userAnswers[currentIdx] = { id: questions[currentIdx].id, value: nextBtn.dataset.value };
                currentIdx++;
                renderQuestion();
            }
            else {
                uploadResults();
            }
        }

        nextBtn.addEventListener('click', handleNext);
        backBtn.addEventListener('click', () => { if (currentIdx > 0) { currentIdx--; renderQuestion(); } });

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('quiz-view').style.display !== 'block') return;
            if (e.key >= '1' && e.key <= '5') selectOption(e.key);
            if (e.key === 'Enter') handleNext();
            if (e.key === 'Shift') { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }
        });

        window.addEventListener('beforeunload', function (e) {
            if (!isSubmitting && document.getElementById('quiz-view').style.display === 'block') {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
