<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能力倾向测试</title>
    <style>
        /* 禁止选中文本，移除输入提示符感 */
        * {
            user-select: none;
            -webkit-user-select: none;
            /* 1. 解决移动端点按闪烁方块问题 */
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background-color: #f4f7f6; 
            color: #333; 
            padding: 15px;
            /* 防止移动端橡皮筋回弹干扰体验 */
            overflow-x: hidden;
        }
        
        .start-box, .quiz-container { 
            max-width: 850px; 
            margin: 20px auto; 
            padding: 40px 25px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); 
        }

        h1 { color: #6C63FF; margin-bottom: 30px; }

        /* 题目字颜色调黑 */
        h2#question-text { 
            color: #000; 
            font-size: 1.6em; 
            margin: 20px 0 40px 0;
            line-height: 1.5;
            font-weight: 600;
        }

        input#username-input { 
            user-select: text;
            -webkit-user-select: text;
            width: 80%; 
            padding: 15px; 
            margin: 20px 0; 
            border: 2px solid #eee; 
            border-radius: 12px; 
            font-size: 18px;
            outline: none;
            /* 允许移动端默认点击效果以便确认输入框选中 */
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }

        /* 按钮基础样式 */
        .btn { 
            background: #6C63FF; 
            color: white; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 35px; 
            cursor: pointer; 
            font-size: 18px; 
            transition: background 0.2s;
            /* 解决移动端卡在点住状态：移除 hover 干扰 */
        }
        
        /* 仅在非触摸设备上显示 hover 效果 */
        @media (hover: hover) {
            .btn:hover { background: #5a52d5; }
        }

        /* 2. 解决点住不放的效果：改为 active 瞬时反馈 */
        .btn:active { 
            background: #4a42b5 !important; 
            transform: scale(0.98);
        }

        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        
        .btn-secondary { background: #e8e8ed; color: #555; margin-right: 15px; }

        #question-counter { 
            text-align: left; 
            font-size: 14px; 
            color: #6C63FF; 
            font-weight: bold; 
            margin-bottom: 8px; 
        }

        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; margin-bottom: 40px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #6C63FF; transition: width 0.4s ease; }

        #question-prefix { 
            text-align: center; 
            font-size: 14px; 
            color: #999; 
            font-weight: bold; 
            min-height: 20px; 
            margin-bottom: 10px; 
        }

        /* 选项区域 */
        .options-container { 
            display: flex; 
            justify-content: space-between; 
            margin: 40px 0; 
        }
        
        .circle-wrapper { 
            cursor: pointer; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .circle { 
            width: 32px; 
            height: 32px; 
            border: 2px solid #6C63FF; 
            border-radius: 50%; 
            margin-bottom: 10px; 
            transition: 0.2s; 
            background: white; 
        }

        /* 选中状态 */
        .circle.active { 
            background: #6C63FF; 
            box-shadow: 0 0 12px rgba(108,99,255,0.3); 
        }

        .circle-wrapper span { font-size: 12px; color: #666; font-weight: 500; }

        .button-group { display: flex; justify-content: center; align-items: center; margin-top: 20px; }

        #quiz-view { display: none; }

        /* 移动端适配调优 */
        @media (max-width: 480px) {
            h2#question-text { font-size: 1.3em; }
            .circle { width: 28px; height: 28px; }
            .circle-wrapper span { font-size: 11px; scale: 0.9; }
            .btn { padding: 12px 30px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="start-view" class="start-box">
        <h1>欢迎参加测试</h1>
        <p>请输入您的姓名以开始</p>
        <input type="text" id="username-input" placeholder="输入姓名..." spellcheck="false">
        <br>
        <button id="start-btn" class="btn">进入测试</button>
    </div>

    <div id="quiz-view">
        <div class="quiz-container">
            <div id="question-counter"></div>
            <div class="progress-bar"><div id="progress"></div></div>
            <div id="question-prefix"></div>
            <h2 id="question-text">加载中...</h2>

            <div class="options-container">
                <div class="circle-wrapper" data-val="1"><div class="circle"></div><span>非常不符</span></div>
                <div class="circle-wrapper" data-val="2"><div class="circle"></div><span>不符</span></div>
                <div class="circle-wrapper" data-val="3"><div class="circle"></div><span>中立</span></div>
                <div class="circle-wrapper" data-val="4"><div class="circle"></div><span>符合</span></div>
                <div class="circle-wrapper" data-val="5"><div class="circle"></div><span>非常符合</span></div>
            </div>

            <div class="button-group">
                <button id="back-btn" class="btn btn-secondary" style="display: none;">上一题</button>
                <button id="next-btn" class="btn" disabled>下一题</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';

        let questions = [];
        let currentIdx = 0;
        let userAnswers = [];

        const startView = document.getElementById('start-view');
        const quizView = document.getElementById('quiz-view');
        const usernameInput = document.getElementById('username-input');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');
        const counter = document.getElementById('question-counter');
        const prefix = document.getElementById('question-prefix');
        const circles = document.querySelectorAll('.circle-wrapper');

        startBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) return alert("请输入姓名");
            localStorage.setItem('quizUsername', name);
            startView.style.display = 'none';
            quizView.style.display = 'block';
            questions = getQuestions();
            renderQuestion();
        });

        function renderQuestion() {
            const q = questions[currentIdx];
            counter.innerText = `${currentIdx + 1} / ${questions.length}`;
            
            if (q.part === 'LLOS') {
                prefix.style.visibility = "visible";
                prefix.innerText = (q.scale === 'Amotivation') ? "关于学习英语，我认为：" : "我学习英语的原因是：";
            } else {
                prefix.style.visibility = "hidden";
            }

            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + '%';
            
            backBtn.style.display = currentIdx > 0 ? "inline-block" : "none";
            nextBtn.innerText = currentIdx === questions.length - 1 ? "完成提交" : "下一题";
            
            resetOptions();
            if (userAnswers[currentIdx]) {
                selectOption(userAnswers[currentIdx].value);
            }
        }

        function resetOptions() {
            circles.forEach(c => c.querySelector('.circle').classList.remove('active'));
            nextBtn.disabled = true;
        }

        function selectOption(val) {
            circles.forEach(c => {
                const circle = c.querySelector('.circle');
                circle.classList.remove('active');
                if (c.dataset.val == val) circle.classList.add('active');
            });
            nextBtn.disabled = false;
            nextBtn.dataset.value = val;
        }

        circles.forEach(cw => cw.addEventListener('click', (e) => {
            // 防止移动端重复触发
            e.preventDefault();
            selectOption(cw.dataset.val);
        }));

        function handleNext() {
            if (nextBtn.disabled) return;
            userAnswers[currentIdx] = { id: questions[currentIdx].id, value: nextBtn.dataset.value };
            
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
                window.location.href = 'results.html';
            }
        }

        function handleBack() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        nextBtn.addEventListener('click', handleNext);
        backBtn.addEventListener('click', handleBack);

        document.addEventListener('keydown', (e) => {
            if (quizView.style.display !== 'block') return;
            if (e.key >= '1' && e.key <= '5') selectOption(e.key);
            if (e.key === 'Enter') handleNext();
            if (e.key === 'Shift') handleBack();
        });
    </script>
</body>
</html>
