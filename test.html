<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能力倾向测试</title>
    <style>
        * { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f4f7f6; color: #333; padding: 15px; touch-action: manipulation; }
        
        .quiz-container { 
            max-width: 850px; margin: 20px auto; padding: 40px 25px; 
            background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
        }

        #question-counter { text-align: left; font-size: 14px; color: #469aa7; font-weight: bold; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; margin-bottom: 40px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #469aa7; transition: width 0.4s ease; }
        #question-prefix { font-size: 14px; color: #999; font-weight: bold; min-height: 20px; margin-bottom: 10px; }
        h2#question-text { color: #000; font-size: 1.6em; margin: 20px 0 40px 0; line-height: 1.5; font-weight: 600; }

        /* 平面选项样式 */
        .options-container { display: flex; justify-content: space-between; margin: 40px 0; }
        .circle-wrapper { cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .circle { 
            width: 38px; height: 38px; border: 2px solid #469aa7; border-radius: 50%; 
            margin-bottom: 10px; transition: all 0.1s ease; background: white; 
        }
        /* 点按圆圈时的反馈：变色+缩小 */
        .circle-pressing { transform: scale(0.8); background: rgba(70, 154, 167, 0.15) !important; }
        .circle.active { background: #469aa7 !important; transform: scale(1.05); }

        /* 平面按钮样式 */
        .btn { 
            background: #469aa7; color: white; border: none; padding: 14px 45px; 
            border-radius: 35px; cursor: pointer; font-size: 18px; font-weight: bold;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        /* 点按按钮时的反馈：轻微下沉+变色 */
        .btn-pressing { 
            transform: translateY(2px) scale(0.96); 
            background: #367d88 !important; 
            opacity: 0.9;
        }
        .btn:disabled { background: #ccc; transform: none !important; cursor: not-allowed; opacity: 1; }
        
        .btn-secondary { background: #e8e8ed; color: #555; margin-right: 15px; }
        .btn-secondary.btn-pressing { background: #dcdce0 !important; }

        #quiz-view { display: none; }
    </style>
</head>
<body>
    <div id="start-view" class="quiz-container">
        <h1 style="color:#469aa7; margin-bottom:30px;">欢迎参加测试</h1>
        <input type="text" id="username-input" style="width:80%; padding:15px; margin-bottom:30px; border:2px solid #eee; border-radius:12px; font-size:16px; outline:none;" placeholder="请输入您的姓名" spellcheck="false">
        <br><button id="start-btn" class="btn">进入测试</button>
    </div>

    <div id="quiz-view">
        <div class="quiz-container">
            <div id="question-counter"></div>
            <div class="progress-bar"><div id="progress"></div></div>
            <div id="question-prefix"></div>
            <h2 id="question-text">加载中...</h2>
            <div class="options-container">
                <div class="circle-wrapper" data-val="1"><div class="circle"></div><span>非常不符</span></div>
                <div class="circle-wrapper" data-val="2"><div class="circle"></div><span>不符</span></div>
                <div class="circle-wrapper" data-val="3"><div class="circle"></div><span>中立</span></div>
                <div class="circle-wrapper" data-val="4"><div class="circle"></div><span>符合</span></div>
                <div class="circle-wrapper" data-val="5"><div class="circle"></div><span>非常符合</span></div>
            </div>
            <div class="button-group">
                <button id="back-btn" class="btn btn-secondary" style="display: none;">上一题</button>
                <button id="next-btn" class="btn" disabled>下一题</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getQuestions } from './questions.js';
        let questions = [], currentIdx = 0, userAnswers = [];

        function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(12); }

        // 统一处理触屏按下反馈
        function attachFeedback(el, activeClass) {
            const press = () => { if(!el.disabled) { el.classList.add(activeClass); } };
            const release = () => el.classList.remove(activeClass);
            el.addEventListener('touchstart', press);
            el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');

        attachFeedback(startBtn, 'btn-pressing');
        attachFeedback(nextBtn, 'btn-pressing');
        attachFeedback(backBtn, 'btn-pressing');
        document.querySelectorAll('.circle-wrapper').forEach(cw => {
            attachFeedback(cw.querySelector('.circle'), 'circle-pressing');
        });

        startBtn.addEventListener('click', () => {
            triggerHaptic();
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert("请输入姓名");
            localStorage.setItem('quizUsername', name);
            document.getElementById('start-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            questions = getQuestions();
            renderQuestion();
        });

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-counter').innerText = `${currentIdx + 1} / ${questions.length}`;
            const prefix = document.getElementById('question-prefix');
            if (q.part === 'LLOS') {
                prefix.style.visibility = "visible";
                prefix.innerText = (q.scale === 'Amotivation') ? "关于学习英语，我认为：" : "我学习英语的原因是：";
            } else { prefix.style.visibility = "hidden"; }
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + '%';
            backBtn.style.display = currentIdx > 0 ? "inline-block" : "none";
            nextBtn.innerText = currentIdx === questions.length - 1 ? "完成提交" : "下一题";
            resetOptions();
            if (userAnswers[currentIdx]) selectOption(userAnswers[currentIdx].value);
        }

        function resetOptions() {
            document.querySelectorAll('.circle').forEach(c => c.classList.remove('active'));
            nextBtn.disabled = true;
        }

        function selectOption(val) {
            triggerHaptic();
            document.querySelectorAll('.circle-wrapper').forEach(cw => {
                cw.querySelector('.circle').classList.toggle('active', cw.dataset.val == val);
            });
            nextBtn.disabled = false;
            nextBtn.dataset.value = val;
        }

        document.querySelectorAll('.circle-wrapper').forEach(cw => cw.addEventListener('click', () => selectOption(cw.dataset.val)));

        nextBtn.addEventListener('click', () => {
            triggerHaptic();
            userAnswers[currentIdx] = { id: questions[currentIdx].id, value: nextBtn.dataset.value };
            if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
            else { localStorage.setItem('userAnswers', JSON.stringify(userAnswers)); window.location.href = 'results.html'; }
        });

        backBtn.addEventListener('click', () => { triggerHaptic(); if (currentIdx > 0) { currentIdx--; renderQuestion(); } });
    </script>
</body>
</html>
