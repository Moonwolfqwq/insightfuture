<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能力倾向测试</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; color: #333; padding: 20px; }
        .start-box, .quiz-container { max-width: 500px; margin: 50px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #6C63FF; }
        input { width: 80%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn { background: #6C63FF; color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 16px; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #6C63FF; transition: width 0.3s; }
        .circle-wrapper { cursor: pointer; flex: 1; }
        .circle { width: 30px; height: 30px; border: 2px solid #6C63FF; border-radius: 50%; margin: 0 auto 5px; transition: 0.2s; }
        .circle.active { background: #6C63FF; }
        .options-container span { font-size: 12px; color: #777; }
        #quiz-view { display: none; } /* 初始隐藏题目页 */
    </style>
</head>
<body>

    <div id="start-view" class="start-box">
        <h1>欢迎参加测试</h1>
        <p>请输入您的姓名以开始</p>
        <input type="text" id="username-input" placeholder="您的姓名">
        <br>
        <button id="start-btn" class="btn">进入测试</button>
    </div>

    <div id="quiz-view">
        <div class="quiz-container">
            <div class="progress-bar"><div id="progress"></div></div>
            <div id="question-prefix" style="text-align: left; font-size: 14px; color: #888; font-weight: bold; min-height: 20px;"></div>
            <h2 id="question-text">正在加载题目...</h2>

            <div class="options-container" style="display: flex; justify-content: space-between; margin: 30px 0;">
                <div class="circle-wrapper" data-val="1"><div class="circle"></div><span>非常不符</span></div>
                <div class="circle-wrapper" data-val="2"><div class="circle"></div><span>不符</span></div>
                <div class="circle-wrapper" data-val="3"><div class="circle"></div><span>中立</span></div>
                <div class="circle-wrapper" data-val="4"><div class="circle"></div><span>符合</span></div>
                <div class="circle-wrapper" data-val="5"><div class="circle"></div><span>非常符合</span></div>
            </div>

            <button id="next-btn" class="btn" disabled>下一题</button>
        </div>
    </div>

    <script type="module">
		import { getQuestions } from './questions.js';

		let questions = [];
		let currentIdx = 0;
		let userAnswers = []; // 这里存储已提交的答案

		const startView = document.getElementById('start-view');
		const quizView = document.getElementById('quiz-view');
		const usernameInput = document.getElementById('username-input');
		const startBtn = document.getElementById('start-btn');
		const nextBtn = document.getElementById('next-btn');
		const qText = document.getElementById('question-text');
		const qPrefix = document.getElementById('question-prefix');
		const circles = document.querySelectorAll('.circle-wrapper');

		// 开始测试
		startBtn.addEventListener('click', () => {
			const name = usernameInput.value.trim();
			if (!name) return alert("请输入姓名");
			localStorage.setItem('quizUsername', name);
			
			startView.style.display = 'none';
			quizView.style.display = 'block';
			
			questions = getQuestions();
			renderQuestion();
		});

		// 渲染题目
		function renderQuestion() {
			const q = questions[currentIdx];
			
			// 引导语逻辑
			if (q.part === 'LLOS') {
				qPrefix.style.display = "block";
				qPrefix.innerText = (q.scale === 'Amotivation') ? "关于学习英语，我认为：" : "我学习英语的原因是：";
			} else {
				qPrefix.style.display = "none";
			}
			
			qText.innerText = q.text;
			document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + '%';
			
			// 重置状态
			circles.forEach(cw => cw.querySelector('.circle').classList.remove('active'));
			nextBtn.disabled = true;
			nextBtn.dataset.value = "";

			// 【新增】回退重新作答逻辑：如果这一题之前做过（回退回来的），恢复之前的选择
			const previousAnswer = userAnswers[currentIdx];
			if (previousAnswer) {
				selectOption(previousAnswer.value);
			}
		}

		// 选择选项
		function selectOption(val) {
			circles.forEach(c => {
				const circle = c.querySelector('.circle');
				circle.classList.remove('active');
				if (c.dataset.val == val) circle.classList.add('active');
			});
			nextBtn.disabled = false;
			nextBtn.dataset.value = val;
		}

		circles.forEach(cw => {
			cw.addEventListener('click', () => selectOption(cw.dataset.val));
		});

		// 下一题逻辑
		function handleNext() {
			if (nextBtn.disabled) return;
			
			// 保存或更新当前题目的答案
			const answer = { id: questions[currentIdx].id, value: nextBtn.dataset.value };
			userAnswers[currentIdx] = answer; // 使用索引存储，方便回退修改

			currentIdx++;

			if (currentIdx < questions.length) {
				renderQuestion();
			} else {
				localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
				window.location.href = 'results.html';
			}
		}

		// 返回上一题逻辑
		function handleBack() {
			if (currentIdx > 0) {
				currentIdx--;
				renderQuestion();
			}
		}

		nextBtn.addEventListener('click', handleNext);

		// 键盘监听 (1-5, Enter, Shift)
		document.addEventListener('keydown', (e) => {
			if (quizView.style.display !== 'block') return;

			// 数字键 1-5
			if (e.key >= '1' && e.key <= '5') {
				selectOption(e.key);
			}

			// Enter 下一题
			if (e.key === 'Enter') {
				handleNext();
			}

			// 【新增】Shift 返回上一题
			if (e.key === 'Shift') {
				handleBack();
			}
		});
	</script>
</body>
</html>
